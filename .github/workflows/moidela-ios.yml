name: Мои дела - сборка и запуск в симуляторах

on:
  push:
    branches: ["claude/**", "main"]
    paths: ["MoiDela/**", ".github/workflows/moidela-ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moidela-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-run:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: MoiDela
    steps:
      - uses: actions/checkout@v4

      - name: Выбрать последнюю стабильную версию Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать MoiDela.xcodeproj
        run: xcodegen generate

      - name: Проверить Xcode, собрать и запустить (iPhone, iPad, Apple TV)
        run: ./scripts/ci-check-and-run.sh
        env:
          OUT: ../docs/step1

      - name: Сохранить скриншоты и отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step1-screenshots
          path: docs/step1

      - name: Закоммитить проект Xcode и скриншоты обратно в ветку
        if: success() && github.event_name != 'pull_request'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MoiDela/MoiDela.xcodeproj docs/step1
          if git diff --cached --quiet; then echo "Нечего коммитить"; exit 0; fi
          git commit -m "CI: сгенерированный MoiDela.xcodeproj и скриншоты [skip ci]"
          git push
