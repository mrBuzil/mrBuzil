# Описание проекта для XcodeGen. Файл MoiDela.xcodeproj генерируется из него
# (в CI автоматически), руками .xcodeproj не правим.
name: MoiDela
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MoiDela:
    type: application
    supportedDestinations: [iOS, tvOS]
    sources:
      - Sources
      - Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Мои дела
        CFBundleDevelopmentRegion: ru
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~iphone:
          [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_NAME: MoiDela
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).moidela
        TARGETED_DEVICE_FAMILY: "1,2,3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Иконка для Apple TV (слоистая) будет позже; пока без неё.
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletv*]": ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
